name: vercel-preview

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Preview Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Verify backend quality gates
        run: ./mvnw -B -ntp verify

  frontend-quality:
    name: Frontend Preview Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Resolve pnpm store directory
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Run frontend test suite with coverage
        run: pnpm --dir frontend test:coverage

      - name: Build frontend
        run: pnpm --dir frontend build

  deploy-preview:
    name: Deploy Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-quality
      - frontend-quality
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment:
      name: vercel-preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate Vercel secrets
        id: vercel-secrets
        run: |
          if [[ -n "${VERCEL_TOKEN}" && -n "${VERCEL_ORG_ID}" && -n "${VERCEL_PROJECT_ID}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel Preview Deployment"
            echo
            echo "Preview deployment skipped because one or more Vercel secrets are not configured."
            echo "Required secrets: \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, \`VERCEL_PROJECT_ID\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Vercel CLI
        if: ${{ steps.vercel-secrets.outputs.configured == 'true' }}
        run: npm install --global vercel@latest

      - name: Pull Vercel preview settings
        if: ${{ steps.vercel-secrets.outputs.configured == 'true' }}
        run: vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"

      - name: Build Vercel preview artifact
        if: ${{ steps.vercel-secrets.outputs.configured == 'true' }}
        run: vercel build --token="${VERCEL_TOKEN}"

      - name: Deploy Vercel preview
        if: ${{ steps.vercel-secrets.outputs.configured == 'true' }}
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --token="${VERCEL_TOKEN}")"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel Preview Deployment"
            echo
            echo "- URL: ${deployment_url}"
            echo "- Source: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  preview-skipped:
    name: Preview Deployment Skipped
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - name: Explain fork skip
        run: |
          {
            echo "### Vercel Preview Deployment"
            echo
            echo "Preview deployment skipped because this pull request comes from a fork and repository secrets are unavailable."
          } >> "$GITHUB_STEP_SUMMARY"
