services:
  - type: web
    name: stridehub-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: off
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: STRIDEHUB_DATABASE_URL
        fromDatabase:
          name: stridehub-postgres
          property: connectionString
      - key: STRIDEHUB_DB_USERNAME
        fromDatabase:
          name: stridehub-postgres
          property: user
      - key: STRIDEHUB_DB_PASSWORD
        fromDatabase:
          name: stridehub-postgres
          property: password
      - key: STRIDEHUB_JWT_SECRET
        generateValue: true
      - key: STRIDEHUB_WEB_ALLOWED_ORIGINS
        value: https://stridehub-platform.vercel.app
      - key: STRIDEHUB_PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: STRIDEHUB_REDIS_HEALTH_ENABLED
        value: "false"

databases:
  - name: stridehub-postgres
    databaseName: stridehub
    user: stridehub
    plan: free
