spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:stridehub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025

management:
  health:
    defaults:
      enabled: false
    db:
      enabled: true
    ping:
      enabled: true
    redis:
      enabled: false
