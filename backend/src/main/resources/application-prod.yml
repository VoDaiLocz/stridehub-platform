spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${STRIDEHUB_DB_URL}
    username: ${STRIDEHUB_DB_USERNAME}
    password: ${STRIDEHUB_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${STRIDEHUB_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${STRIDEHUB_DB_MIN_IDLE:1}
      connection-timeout: 30000
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${STRIDEHUB_REDIS_HOST:localhost}
      port: ${STRIDEHUB_REDIS_PORT:6379}
      timeout: 2s
  mail:
    host: ${STRIDEHUB_MAIL_HOST:localhost}
    port: ${STRIDEHUB_MAIL_PORT:1025}
    username: ${STRIDEHUB_MAIL_USERNAME:}
    password: ${STRIDEHUB_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${STRIDEHUB_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${STRIDEHUB_MAIL_SMTP_STARTTLS:false}

management:
  health:
    redis:
      enabled: ${STRIDEHUB_REDIS_HEALTH_ENABLED:false}

stridehub:
  web:
    allowed-origins: ${STRIDEHUB_WEB_ALLOWED_ORIGINS}
