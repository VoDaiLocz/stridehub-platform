openapi: 3.1.0
info:
  title: StrideHub API
  version: 1.0.0-phase1
  description: >
    Manual OpenAPI contract aligned with the implemented Phase 1 StrideHub backend.
    All business endpoints use the `/api/v1` prefix. The runtime `/v3/api-docs`
    endpoint should expose the same route set for the implemented controllers.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
  - name: Identity
  - name: Catalog
  - name: Cart
  - name: Checkout
  - name: Orders
  - name: Seller
  - name: Payment Webhooks
paths:
  /api/v1/system/ping:
    get:
      tags: [System]
      summary: Verify the API is alive and returning correlation-aware envelopes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ping response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPingEnvelope'
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/identity/register:
    post:
      tags: [Identity]
      summary: Register a buyer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/identity/login:
    post:
      tags: [Identity]
      summary: Authenticate a user and return access plus refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/identity/refresh:
    post:
      tags: [Identity]
      summary: Rotate refresh token and mint a new access token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token pair rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/identity/me:
    get:
      tags: [Identity]
      summary: Return the authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/catalog/categories:
    get:
      tags: [Catalog]
      summary: List active categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogCategoryResponse'
  /api/v1/catalog/brands:
    get:
      tags: [Catalog]
      summary: List active brands
      responses:
        '200':
          description: Brand list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogBrandResponse'
  /api/v1/catalog/products:
    get:
      tags: [Catalog]
      summary: List active products with optional buyer filters
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: brand
          schema:
            type: string
        - in: query
          name: size
          schema:
            type: string
        - in: query
          name: color
          schema:
            type: string
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductListResponse'
  /api/v1/catalog/products/{slug}:
    get:
      tags: [Catalog]
      summary: Get product detail by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductDetailResponse'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Get the authenticated buyer cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the current cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpsertRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/cart/items/{itemId}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemQuantityUpdateRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated cart after removal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/checkout/sessions:
    post:
      tags: [Checkout]
      summary: Create a checkout session from the active cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSessionRequest'
      responses:
        '201':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/checkout/payment-intent:
    post:
      tags: [Checkout]
      summary: Create a provider payment request for an active checkout session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
      responses:
        '200':
          description: Payment request initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List orders for the authenticated buyer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Buyer order summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummaryResponse'
        '401':
          $ref: '#/components/responses/ApiError'
  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get a buyer order by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/seller/application:
    post:
      tags: [Seller]
      summary: Submit the current buyer's seller application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerApplicationRequest'
      responses:
        '201':
          description: Seller application submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApplicationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
    get:
      tags: [Seller]
      summary: Get the current user's seller application
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current seller application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApplicationResponse'
        '401':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /api/v1/webhooks/payment/provider:
    post:
      tags: [Payment Webhooks]
      summary: Receive signed payment provider events
      parameters:
        - in: header
          name: X-Signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEventRequest'
      responses:
        '202':
          description: Webhook accepted for processing
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ApiError:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ValidationError:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    ApiErrorResponse:
      type: object
      required: [code, message, details, timestamp, correlationId, path]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
        path:
          type: string
    SystemPingEnvelope:
      type: object
      required: [success, data, timestamp, correlationId]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/SystemPingResponse'
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
    SystemPingResponse:
      type: object
      required: [service, timestamp, activeProfiles]
      properties:
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        activeProfiles:
          type: array
          items:
            type: string
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserProfileResponse'
    UserProfileResponse:
      type: object
      required: [id, email, name, emailVerified, status, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        status:
          type: string
        roles:
          type: array
          items:
            type: string
    CatalogCategoryResponse:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    CatalogBrandResponse:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    CategorySummaryResponse:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    BrandSummaryResponse:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    ProductVariantResponse:
      type: object
      required: [id, sku, size, color, price]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        size:
          type: string
        color:
          type: string
        price:
          type: number
        compareAtPrice:
          type: number
          nullable: true
    CatalogProductImageResponse:
      type: object
      required: [id, imageUrl, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        imageUrl:
          type: string
        altText:
          type: string
          nullable: true
        sortOrder:
          type: integer
    CatalogProductListItemResponse:
      type: object
      required: [id, slug, name, shortDescription, currencyCode, category, brand, primaryVariant]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        shortDescription:
          type: string
        currencyCode:
          type: string
        category:
          $ref: '#/components/schemas/CategorySummaryResponse'
        brand:
          $ref: '#/components/schemas/BrandSummaryResponse'
        primaryVariant:
          $ref: '#/components/schemas/ProductVariantResponse'
        primaryImageUrl:
          type: string
          nullable: true
    CatalogProductListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProductListItemResponse'
    CatalogProductDetailResponse:
      type: object
      required:
        [id, slug, name, shortDescription, longDescription, currencyCode, category, brand, variants, images]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        shortDescription:
          type: string
        longDescription:
          type: string
        currencyCode:
          type: string
        category:
          $ref: '#/components/schemas/CategorySummaryResponse'
        brand:
          $ref: '#/components/schemas/BrandSummaryResponse'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariantResponse'
        images:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProductImageResponse'
    CartItemUpsertRequest:
      type: object
      required: [variantId, quantity]
      properties:
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    CartItemQuantityUpdateRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    CartItemResponse:
      type: object
      required:
        [id, productId, productName, productSlug, variantId, sku, sizeValue, colorValue, currencyCode, quantity, unitPriceAmount, lineTotalAmount]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        productSlug:
          type: string
        variantId:
          type: string
          format: uuid
        sku:
          type: string
        sizeValue:
          type: string
        colorValue:
          type: string
        currencyCode:
          type: string
        quantity:
          type: integer
        unitPriceAmount:
          type: number
        lineTotalAmount:
          type: number
    CartResponse:
      type: object
      required: [id, status, currencyCode, totalItems, subtotalAmount, items]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        currencyCode:
          type: string
        totalItems:
          type: integer
        subtotalAmount:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemResponse'
    CheckoutSessionRequest:
      type: object
      required: [shippingAddressId]
      properties:
        shippingAddressId:
          type: string
          format: uuid
    CheckoutSessionResponse:
      type: object
      required: [id, status, reservationExpiresAt, amount, currency]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        reservationExpiresAt:
          type: string
          format: date-time
        amount:
          type: number
        currency:
          type: string
    PaymentIntentRequest:
      type: object
      required: [checkoutSessionId]
      properties:
        checkoutSessionId:
          type: string
          format: uuid
    PaymentIntentResponse:
      type: object
      required: [paymentId, providerReference, redirectUrl]
      properties:
        paymentId:
          type: string
          format: uuid
        providerReference:
          type: string
        redirectUrl:
          type: string
    OrderItemResponse:
      type: object
      required: [productVariantId, sku, quantity, unitPrice]
      properties:
        productVariantId:
          type: string
          format: uuid
        sku:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
    OrderSummaryResponse:
      type: object
      required: [id, orderNumber, status, totalAmount, currency]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          type: string
        totalAmount:
          type: number
        currency:
          type: string
    OrderResponse:
      type: object
      required: [id, orderNumber, status, totalAmount, currency, items]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          type: string
        totalAmount:
          type: number
        currency:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
    SellerApplicationRequest:
      type: object
      required: [storeName]
      properties:
        storeName:
          type: string
        legalName:
          type: string
          nullable: true
    SellerApplicationResponse:
      type: object
      required: [id, storeName, status, submittedAt]
      properties:
        id:
          type: string
          format: uuid
        storeName:
          type: string
        legalName:
          type: string
          nullable: true
        status:
          type: string
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
    PaymentWebhookEventRequest:
      type: object
      required: [eventId, providerReference, eventType]
      properties:
        eventId:
          type: string
        providerReference:
          type: string
        eventType:
          type: string
        amount:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
